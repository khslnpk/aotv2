[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sleep-twin"
version = "0.1.0"
description = "Wearable sleep-stage classification + Digital Twin: subject-normalized features, ensemble of XGBoost/LightGBM/CatBoost + BiLSTM, HMM/Viterbi smoothing."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
